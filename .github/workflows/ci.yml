name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch; only the latest matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Runs first and independently of the tests. Node executes these sources
      # by stripping types without checking them, so the suite can pass green
      # on code that does not compile — which has already happened once.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
