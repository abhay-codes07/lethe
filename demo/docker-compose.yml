# The demo estate.
#
# A small imitation of the sprawl a real erasure request has to cross:
# a primary database, an object store holding exports, a vector index built
# from support tickets, and an append-only log. Nothing here is a mock — they
# are the real servers, so discovery has to do real work.
#
# Everything runs locally and holds synthetic data only. See demo/seed/.

name: lethe-demo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lethe
      POSTGRES_PASSWORD: lethe_demo_only
      POSTGRES_DB: acme
    ports:
      - '55432:5432'
    volumes:
      # Runs in filename order: schema, then data, then the read-only role.
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lethe -d acme']
      interval: 3s
      timeout: 3s
      retries: 20

  # Object store, standing in for the exports bucket.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lethe
      MINIO_ROOT_PASSWORD: lethe_demo_only
    ports:
      - '59000:9000'
      - '59001:9001'
    # No healthcheck: the minio image's tooling varies between tags, and a
    # healthcheck that is wrong is worse than none — it reports unhealthy
    # forever and sends people debugging the wrong thing. `demo/verify.sh`
    # checks readiness from outside instead.

  # Vector index. The store where a delete only tombstones, which is the case
  # the whole `requires_compaction` disposition exists for.
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - '56333:6333'
